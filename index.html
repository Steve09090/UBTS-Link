<style>
:root{--forest:#123c34;--forest-2:#1c594d;--mint:#eaf3ee;--mint-2:#f3f7f4;--paper:#fbfcfa;--ink:#172522;--muted:#75817b;--line:#e4e9e5;--coral:#c75243;--coral-soft:#fbefed;--amber:#966b17;--amber-soft:#faf4e6;--blue:#416c88;--blue-soft:#edf4f8;--white:#fff;--shadow:0 14px 38px rgba(25,50,39,.12);--serif:Georgia,'Times New Roman',serif;--sans:'Trebuchet MS','Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8bc5a7;outline-offset:2px}.shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--forest);color:#f4f8f5;padding:25px 17px 18px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 27px}.brand-mark{width:35px;height:35px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.34);border-radius:10px;color:#d6e8d9;font:24px/1 var(--serif)}.brand-name{font:19px/1 var(--serif);letter-spacing:0}.brand-sub{font-size:10px;color:#a9c6b6;margin-top:5px;letter-spacing:.7px}.nav-label{padding:12px 11px 8px;color:#92b2a3;text-transform:uppercase;font-size:10px;letter-spacing:1.25px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#c8d9d0;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:5px;font-size:13px}.nav button:hover,.nav button.active{background:#28584b;color:#fff}.nav-icon{width:19px;text-align:center;font-size:16px}.sidebar-bottom{margin-top:auto}.facility-card{margin:12px 3px 15px;padding:12px;border:1px solid rgba(255,255,255,.16);border-radius:5px}.facility-label{font-size:10px;color:#a9c6b6;text-transform:uppercase;letter-spacing:.85px}.facility-name{margin-top:5px;font-size:12px;color:white}.facility-meta{margin-top:2px;font-size:11px;color:#a9c6b6}.use rgin-bottom:19px}.metric{min-height:113px;background:white;border:1px solid var(--line);border-radius:5px;padding:16px 17px;position:relative;overflow:hidden}.metric:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#79a18a}.metric.warn:before{background:#d2a748}.metric.alert:before{background:var(--coral)}.metric-label{font-size:11px;color:var(--muted)}.metric-value{margin-top:6px;font:30px/1 var(--serif)}.metric-foot{margin-top:9px;font-size:10px;color:var(--muted)}.metric-foot b{color:var(--forest-2);font-weight:600}.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:15px;margin-bottom:15px}.panel{background:white;border:1px solid var(--line);border-radius:5px;min-width:0}.panel-head{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}.panel-title{font:17px/1.2 var(--serif)}.panel-subtitle{font-size:10px;color:var(--muted);margin-top:3px}.link-button{border:0;background:transparent;color:var(--forest-2);font-weight:600;font-size:11px;padding:6px}.link-button:hover{text-decoration:underline}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{padding:10px 15px;background:#fafbf9;border-bottom:1px solid var(--line);color:#77837d;text-transform:uppercase;letter-spacing:.65px;font-size:9px;font-weight:600}td{padding:11px 15px;border-bottom:1px solid #edf0ed;font-size:11px}tbody tr:last-child td{border-bottom:0}.blood{display:inline-grid;place-items:center;min-width:34px;height:26px;border:1px solid #e1e8e2;border-radius:3px;background:#f8faf8;color:var(--forest);font-weight:700;font-size:11px}.count-cell{font-weight:700;font-size:13px}.stock-track{width:92px;height:5px;border-radius:5px;background:#edf0ed;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:7px}.stock-fill{height:100%;background:#78a48a;border-radius:5px}.stock-fill.low{background:#cf9b37}.stock-fill.critical{background:var(--coral)}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:3px;font-size:10px}.pill:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.pill-good{background:var(--mint);color:var(--forest-2)}.pill-warn{background:var(--amber-soft);color:var(--amber)}.pill-alert{background:var(--coral-soft);color:var(--coral)}.pill-blue{background:var(--blue-soft);color:var(--blue)}.type-list{display:flex;align-items:center;gap:4px}.requests-list{display:grid}.request-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #edf0ed}.request-row:last-child{border-bottom:0}.request-info{min-width:0}.request-type{display:flex;align-items:center;gap:8px;font-weight:600;font-size:11px}.request-detail{margin:4px 0 0 42px;color:var(--muted);font-size:10px}.request-qty{font-weight:700;white-space:nowrap;font-size:11px}.empty-state{padding:28px 16px;text-align:center;color:var(--muted);font-size:11px}.movement-row{display:grid;grid-template-columns:68px 1fr auto;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid #edf0ed;font-size:11px}.movement-row:last-child{border-bottom:0}.movement-time{color:var(--muted);font-size:10px}.movement-barcode{display:block;color:var(--muted);font-size:10px;margin-top:2px}.movement-qty{font-weight:700}.search-box{position:relative}.search-box input{width:min(250px,29vw);height:34px;border:1px solid var(--line);border-radius:4px;padding:0 11px 0 31px;background:#fff;font-size:11px}.search-icon{position:absolute;left:10px;top:7px;color:#8a958e;font-size:15px}.toolbar{display:flex;align-items:center;gap:8px}.filter-select{height:34px;padding:0 27px 0 10px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink);font-size:11px}.table-meta{padding:10px 15px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.cell-action{border:0;background:transparent;color:var(--forest-2);font-weight:600;font-size:10px;padding:4px}.section-gap{margin-top:15px}.log-type{font-size:10px;color:var(--muted)}.notice{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;background:#f5f7f4;border:1px solid var(--line);border-radius:4px;font-size:10px;color:var(--muted);margin-top:15px}.notice-mark{color:var(--forest-2);font-weight:bold}.modal-backdrop{position:fixed;inset:0;z-index:10;background:rgba(14,32,26,.49);display:grid;place-items:center;padding:20px}.modal{width:min(490px,100%);max-height:90vh;overflow:auto;background:white;border-radius:6px;box-shadow:var(--shadow);animation:rise .18s ease-out}.modal-head{padding:19px 21px 13px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.modal-head h2{font:22px/1.2 var(--serif);margin:0}.modal-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.close-btn{border:0;background:transparent;color:var(--muted);font-size:21px;line-height:1;padding:0 3px}.modal-body{padding:18px 21px 21px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#56645b;font-weight:600}.field input,.field select{height:37px;width:100%;border:1px solid #dfe5e0;border-radius:4px;padding:0 10px;background:white;color:var(--ink);font-size:12px}.field input:focus,.field select:focus{border-color:#83a993}.field-help{font-size:9px;color:var(--muted)}.scan-readout{display:flex;gap:8px;align-items:center;padding:10px;background:var(--mint-2);border:1px solid #e2ebe4;border-radius:4px;color:#50665a;font-size:10px;margin:0 0 14px}.scan-dot{width:7px;height:7px;border-radius:50%;background:#5a9770}.form-error{display:none;margin-top:12px;padding:8px 10px;border-radius:3px;color:var(--coral);background:var(--coral-soft);font-size:10px}.form-error.show{display:block}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:22px;bottom:22px;z-index:20;padding:11px 15px;background:var(--forest);color:white;border-radius:4px;box-shadow:var(--shadow);font-size:12px;animation:rise .18s ease-out}.toast.error{background:#923d34}.mobile-menu{display:none}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1050px){.shell{grid-template-columns:205px minmax(0,1fr)}.sidebar{padding-left:12px;padding-right:12px}.content{padding:25px 22px 36px}.topbar{padding:0 22px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-main{grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr)}}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:12px 15px 0}.brand{padding:0 2px 10px}.brand-mark{width:30px;height:30px}.brand-name{font-size:17px}.nav-label,.sidebar-bottom{display:none}.nav{display:flex;overflow-x:auto;padding:0 0 9px;gap:4px}.nav button{padding:8px 10px;white-space:nowrap;font-size:11px}.nav-icon{width:auto}.topbar{height:48px;padding:0 16px}.top-date{display:none}.content{padding:21px 15px 30px}.page-heading{align-items:flex-start;flex-direction:column;margin-bottom:17px;gap:13px}.page-heading h1{font-size:28px}.heading-actions{width:100%}.heading-actions .btn{flex:1}.metrics{gap:8px}.metric{min-height:100px;padding:13px}.metric-value{font-size:26px}.grid-main{grid-template-columns:1fr;gap:11px}.search-box input{width:100%;max-width:none}.toolbar{flex:1}.toolbar .search-box{flex:1}.inventory-toolbar{display:flex;flex-wrap:wrap}.inventory-toolbar .toolbar{width:100%;order:2}.inventory-toolbar>.btn{margin-left:auto}.demo-chip{font-size:9px}.panel-title{font-size:16px}}
@media(max-width:400px){.nav button{padding:7px 8px}.nav-icon{display:none}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.heading-actions .btn{padding:8px;font-size:11px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions{gap:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
(() => {
  const STORAGE_KEY = 'ubts-link-v1';
  const THRESHOLD = 6;
  const bloodTypes = ['O+','O-','A+','A-','B+','B-','AB+','AB-'];
  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modal-root');
  const today = () => new Date().toISOString().slice(0, 10);
  const shiftDate = (days) => { const date = new Date(); date.setDate(date.getDate() + days); return date.toISOString().slice(0, 10); };
  const makeSeed = () => {
    const counts = {'O+':24,'O-':7,'A+':17,'A-':4,'B+':11,'B-':3,'AB+':8,'AB-':5};
    const units = [];
    Object.entries(counts).forEach(([type, count], group) => {
      for (let index = 0; index < count; index++) {
        const serial = String(group * 100 + index + 1).padStart(5, '0');
        const days = index < 2 ? index + 2 : 6 + index * 2;
        units.push({barcode:`IST128-26-${serial}`, type, component:'Whole blood', collected:shiftDate(-5 - index), expires:shiftDate(days), source:'Central Region Hub', status:'available'});
      }
    });
    return {units, requisitions:[], movements:[], threshold:THRESHOLD};
  };
  let state;
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || makeSeed(); }
  catch { state = makeSeed(); }
  if (!state || !Array.isArray(state.units)) state = makeSeed();
  state.requisitions ||= [];
  state.movements ||= [];
  state.threshold = THRESHOLD;
  let currentPage = 'overview';
  let inventorySearch = '';
  let inventoryFilter = 'all';
  let toastTimer;

  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const available = (type) => state.units.filter(unit => unit.type === type && unit.status === 'available' && unit.expires > today()).length;
  const activeRequest = (type) => state.requisitions.some(request => request.type === type && request.status !== 'received' && request.status !== 'cancelled');
  const dateLabel = (date) => new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(`${date}T00:00:00`));
  const timeLabel = (date) => new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'}).format(new Date(date));
  const code = () => {
    let sequence = state.requisitions.length + 1;
    let id;
    do {
      id = `REQ-${today().replace(/-/g, '')}-${String(sequence++).padStart(4, '0')}`;
    } while (state.requisitions.some(request => request.id === id));
    return id;
  };
  const addMovement = (action, unit, detail='') => state.movements.unshift({action,barcode:unit.barcode,type:unit.type,detail,at:new Date().toISOString()});
  function normalizeRequestIds() {
    const used = new Set();
    state.requisitions.forEach((request, index) => {
      if (!request.id || used.has(request.id)) {
        let sequence = index + 1;
        let id;
        do {
          id = `REQ-${today().replace(/-/g, '')}-${String(sequence++).padStart(4, '0')}`;
        } while (used.has(id) || state.requisitions.some(item => item !== request && item.id === id));
        request.id = id;
      }
      used.add(request.id);
    });
  }
  normalizeRequestIds();
  function checkRequisitions() {
    for (const type of bloodTypes) {
      if (available(type) <= THRESHOLD && !activeRequest(type)) {
        state.requisitions.unshift({id:code(),type,quantity:Math.max(THRESHOLD * 2 - available(type),THRESHOLD),hub:'Central Region Hub',status:'pending',created:new Date().toISOString()});
      }
    }
  }
  function reconcileExpired() {
    let changed = false;
    for (const unit of state.units) {
      if (unit.status === 'available' && unit.expires <= today()) {
        unit.status = 'expired';
        addMovement('Expired',unit,'Automatically flagged at expiry');
        changed = true;
      }
    }
    if (changed) { checkRequisitions(); save(); }
  }
  reconcileExpired();
  checkRequisitions();
  save();

  const navItems = [{id:'overview',icon:'⌂',label:'Overview'},{id:'inventory',icon:'▤',label:'Inventory'},{id:'requisitions',icon:'↗',label:'Requisitions'},{id:'activity',icon:'◷',label:'Movement log'}];
  const navMarkup = () => navItems.map(item => `<button type="button" data-page="${item.id}" class="${currentPage===item.id?'active':''}"><span class="nav-icon" aria-hidden="true">${item.icon}</span>${item.label}</button>`).join('');
  const requestPill = (status) => `<span class="pill ${status==='pending'?'pill-warn':status==='sent'?'pill-blue':status==='received'?'pill-good':'pill-alert'}">${escapeHtml(status==='pending'?'Awaiting hub':status[0].toUpperCase()+status.slice(1))}</span>`;
  const unitStatus = (unit) => unit.status === 'available' && unit.expires <= today() ? 'expired' : unit.status;
  const statusPill = (unit) => { const status=unitStatus(unit); return `<span class="pill ${status==='available'?'pill-good':status==='expired'?'pill-alert':'pill-blue'}">${status==='available'?'Available':status==='expired'?'Expired':'Dispensed'}</span>`; };
  function heading(eyebrow,title,description,actions='') {
    return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;
  }
  function metricsMarkup() {
    const availableCount = state.units.filter(unit => unitStatus(unit)==='available').length;
    const lowTypes = bloodTypes.filter(type => available(type) <= THRESHOLD).length;
    const expiring = state.units.filter(unit => unitStatus(unit)==='available' && unit.expires <= shiftDate(7)).length;
    const openRequests = state.requisitions.filter(request => request.status==='pending'||request.status==='sent').length;
    return `<section class="metrics" aria-label="Inventory summary">
      <article class="metric"><div class="metric-label">Available units</div><div class="metric-value">${availableCount}</div><div class="metric-foot">Across <b>8 blood groups</b></div></article>
      <article class="metric ${lowTypes?'warn':''}"><div class="metric-label">Groups below threshold</div><div class="metric-value">${lowTypes}</div><div class="metric-foot">Reorder point: <b>${THRESHOLD} units</b></div></article>
      <article class="metric ${expiring?'warn':''}"><div class="metric-label">Expiring in 7 days</div><div class="metric-value">${expiring}</div><div class="metric-foot">Prioritize oldest expiry first</div></article>
      <article class="metric ${openRequests?'alert':''}"><div class="metric-label">Open hub requests</div><div class="metric-value">${openRequests}</div><div class="metric-foot">For <b>Central Region Hub</b></div></article>
    </section>`;
  }
  function stockPanel() {
    const rows = bloodTypes.map(type => {
      const count=available(type), low=count<=THRESHOLD, critical=count<=3;
      const open=state.requisitions.find(request=>request.type===type&&(request.status==='pending'||request.status==='sent'));
      return `<tr><td><span class="blood">${type}</span></td><td class="count-cell">${count}<span class="stock-track"><span class="stock-fill ${critical?'critical':low?'low':''}" style="display:block;width:${Math.min(count/20*100,100)}%"></span></span></td><td>${low?`<span class="pill ${critical?'pill-alert':'pill-warn'}">${critical?'Critical':'Low stock'}</span>`:'<span class="pill pill-good">In range</span>'}</td><td>${open?requestPill(open.status):'<span class="log-type">—</span>'}</td></tr>`;
    }).join('');
    return `<section class="panel"><div class="panel-head"><div><div class="panel-title">Stock by blood group</div><div class="panel-subtitle">Available units against ${THRESHOLD}-unit reorder point</div></div><button class="link-button" data-page="inventory">View inventory →</button></div><div class="table-wrap"><table><thead><tr><th>Blood group</th><th>Available</th><th>Stock level</th><th>Hub request</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }
  function requestPanel(limit=4) {
    const requests=state.requisitions.filter(request=>request.status!=='cancelled').slice(0,limit);
    const body=requests.length?`<div class="requests-list">${requests.map(request=>`<div class="request-row"><div class="request-info"><div class="request-type"><span class="blood">${escapeHtml(request.type)}</span>${escapeHtml(request.id)}</div><div class="request-detail">${escapeHtml(request.hub)} · ${dateLabel(request.created.slice(0,10))}</div></div><div style="text-align:right"><div class="request-qty">${request.quantity} units</div><div style="margin-top:5px">${requestPill(request.status)}</div></div></div>`).join('')}</div>`:'<div class="empty-state">No open requisitions. Stock levels are in range.</div>';
    return `<section class="panel"><div class="panel-head"><div><div class="panel-title">Hub requisitions</div><div class="panel-subtitle">Low-stock requests to the regional hub</div></div><button class="link-button" data-page="requisitions">All requests →</button></div>${body}</section>`;
  }
  function movementPanel(limit=5) {
    const entries=state.movements.slice(0,limit);
    const body=entries.length?entries.map(item=>`<div class="movement-row"><div class="movement-time">${timeLabel(item.at)}</div><div><strong>${escapeHtml(item.action)}</strong> · <span class="blood" style="height:20px;min-width:28px">${escapeHtml(item.type)}</span><span class="movement-barcode">${escapeHtml(item.barcode)}${item.detail?` · ${escapeHtml(item.detail)}`:''}</span></div><div class="movement-qty">1 unit</div></div>`).join(''):'<div class="empty-state">Scanned stock movements will appear here.</div>';
    return `<section class="panel"><div class="panel-head"><div><div class="panel-title">Recent movements</div><div class="panel-subtitle">Latest scanned unit activity</div></div><button class="link-button" data-page="activity">Full log →</button></div>${body}</section>`;
  }
  function overviewPage() {
    return `${heading('Hospital inventory','Blood stock overview','Kampala Regional Hospital · Central Region Hub',`<button class="btn btn-secondary" data-action="scan">⌕ &nbsp;Scan a unit</button><button class="btn btn-primary" data-action="intake">＋ &nbsp;Receive stock</button>`)}${metricsMarkup()}<div class="grid-main">${stockPanel()}${requestPanel()}</div>${movementPanel()}<div class="notice"><span class="notice-mark">i</span><span>Demo workspace: inventory and requisitions are saved in this browser. A live central database and regional hub connection are not configured. Barcode scanners can enter IDs directly into the scan field.</span></div>`;
  }
  function inventoryPage() {
    const visible=state.units.filter(unit=>{
      const status=unitStatus(unit);
      const query=inventorySearch.trim().toLowerCase();
      return (inventoryFilter==='all'||status===inventoryFilter) && (!query||[unit.barcode,unit.type,unit.source].some(value=>String(value).toLowerCase().includes(query)));
    }).sort((a,b)=>a.expires.localeCompare(b.expires));
    const rows=visible.map(unit=>`<tr><td><strong>${escapeHtml(unit.barcode)}</strong></td><td><span class="blood">${escapeHtml(unit.type)}</span></td><td>${escapeHtml(unit.component)}</td><td>${dateLabel(unit.collected)}</td><td>${dateLabel(unit.expires)}</td><td>${escapeHtml(unit.source)}</td><td>${statusPill(unit)}</td><td>${unitStatus(unit)==='available'?`<button class="cell-action" data-action="scan-unit" data-barcode="${escapeHtml(unit.barcode)}">Dispense</button>`:'—'}</td></tr>`).join('');
    const actions=`<button class="btn btn-secondary" data-action="scan">⌕ &nbsp;Scan a unit</button><button class="btn btn-primary" data-action="intake">＋ &nbsp;Receive stock</button>`;
    return `${heading('Stock register','Unit inventory','Search, review expiry dates, and record unit movements.',actions)}<section class="panel"><div class="panel-head inventory-toolbar"><div><div class="panel-title">Blood units</div><div class="panel-subtitle">${visible.length} of ${state.units.length} recorded units</div></div><div class="toolbar"><label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="inventory-search" type="search" placeholder="Search barcode or group" value="${escapeHtml(inventorySearch)}" aria-label="Search inventory"></label><select class="filter-select" id="inventory-filter" aria-label="Filter by status"><option value="all" ${inventoryFilter==='all'?'selected':''}>All statuses</option><option value="available" ${inventoryFilter==='available'?'selected':''}>Available</option><option value="dispensed" ${inventoryFilter==='dispensed'?'selected':''}>Dispensed</option><option value="expired" ${inventoryFilter==='expired'?'selected':''}>Expired</option></select></div></div><div class="table-wrap"><table><thead><tr><th>IST-128 barcode</th><th>Group</th><th>Component</th><th>Collected</th><th>Expires</th><th>Source</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty-state">No matching units found.</td></tr>'}</tbody></table></div><div class="table-meta">Units at or past their expiry date are automatically marked expired. Dispensing a unit removes it from available stock.</div></section>`;
  }
  function requisitionsPage() {
    const requests=state.requisitions.filter(request=>request.status!=='cancelled');
    const rows=requests.map(request=>`<tr><td><strong>${escapeHtml(request.id)}</strong></td><td><span class="blood">${escapeHtml(request.type)}</span></td><td class="count-cell">${request.quantity}</td><td>${escapeHtml(request.hub)}</td><td>${dateLabel(request.created.slice(0,10))}</td><td>${requestPill(request.status)}</td><td>${request.status==='pending'?`<button class="cell-action" data-action="dispatch" data-id="${escapeHtml(request.id)}">Mark sent</button>`:request.status==='sent'?`<button class="cell-action" data-action="acknowledge" data-id="${escapeHtml(request.id)}">Acknowledge</button>`:'—'}</td></tr>`).join('');
    return `${heading('Regional supply','Requisitions',`Requests are created automatically when a blood group reaches ${THRESHOLD} available units or fewer.`,`<button class="btn btn-secondary" data-action="scan">⌕ &nbsp;Scan a unit</button>`)}<section class="panel"><div class="panel-head"><div><div class="panel-title">Requests to Central Region Hub</div><div class="panel-subtitle">Automated reorder point · ${THRESHOLD} units per blood group</div></div><span class="demo-chip">LOCAL DEMO</span></div><div class="table-wrap"><table><thead><tr><th>Request ID</th><th>Blood group</th><th>Units requested</th><th>Regional hub</th><th>Created</th><th>Status</th><th>Update</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty-state">No requisitions yet.</td></tr>'}</tbody></table></div><div class="table-meta">Requests are saved locally in this browser and are not transmitted to a live regional hub.</div></section><div class="section-gap">${stockPanel()}</div>`;
  }
  function activityPage() {
    const rows=state.movements.map(item=>`<tr><td>${timeLabel(item.at)}</td><td><strong>${escapeHtml(item.action)}</strong></td><td>${escapeHtml(item.barcode)}</td><td><span class="blood">${escapeHtml(item.type)}</span></td><td>${escapeHtml(item.detail||'—')}</td></tr>`).join('');
    return `${heading('Audit trail','Movement log','Recorded intake, dispensing, and expiry events for scanned units.') }<section class="panel"><div class="panel-head"><div><div class="panel-title">Unit movement history</div><div class="panel-subtitle">${state.movements.length} recorded events</div></div></div><div class="table-wrap"><table><thead><tr><th>Recorded</th><th>Movement</th><th>IST-128 barcode</th><th>Group</th><th>Details</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty-state">No unit movements recorded.</td></tr>'}</tbody></table></div></section>`;
  }
  function render() {
    const pages={overview:overviewPage,inventory:inventoryPage,requisitions:requisitionsPage,activity:activityPage};
    const titles={overview:'Overview',inventory:'Inventory',requisitions:'Requisitions',activity:'Movement log'};
    app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark" aria-hidden="true">U</div><div><div class="brand-name">UBTS-Link</div><div class="brand-sub">BLOOD STOCK OPERATIONS</div></div></div><div class="nav-label">Workspace</div><nav class="nav" aria-label="Main navigation">${navMarkup()}</nav><div class="sidebar-bottom"><div class="facility-card"><div class="facility-label">Current facility</div><div class="facility-name">Kampala Regional Hospital</div><div class="facility-meta">Linked hub · Central Region</div></div><div class="user-row"><div class="avatar">KM</div><div><div class="user-name">K. Mutesi</div><div class="user-role">Inventory officer</div></div></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Hospital operations &nbsp;/&nbsp; <strong>${titles[currentPage]}</strong></div><div class="top-actions"><span class="top-date">${new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(new Date())}</span><span class="demo-chip">DEMO ENVIRONMENT</span></div></header><div class="content">${pages[currentPage]()}</div></main></div>`;
  }
  function showToast(message,error=false) {
    const root=document.getElementById('toast-root');
    root.innerHTML=`<div class="toast ${error?'error':''}" role="status">${escapeHtml(message)}</div>`;
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>root.replaceChildren(),3200);
  }
  function closeModal() { modalRoot.innerHTML=''; }
  function modal(title,subtitle,body) {
    modalRoot.innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div><button class="close-btn" type="button" data-action="close-modal" aria-label="Close">×</button></div>${body}</section></div>`;
    modalRoot.querySelector('input')?.focus();
  }
  function intakeModal(prefill={}) {
    const body=`<form id="intake-form" class="modal-body"><div class="scan-readout"><span class="scan-dot"></span>Scan the IST-128 label, or type its barcode and press Tab.</div><div class="form-grid"><div class="field full"><label for="intake-barcode">Unit barcode</label><input id="intake-barcode" name="barcode" placeholder="IST128-26-00001" autocomplete="off" required value="${escapeHtml(prefill.barcode||'')}"></div><div class="field"><label for="intake-type">Blood group</label><select id="intake-type" name="type" required>${bloodTypes.map(type=>`<option ${prefill.type===type?'selected':''}>${type}</option>`).join('')}</select></div><div class="field"><label for="intake-component">Component</label><select id="intake-component" name="component"><option>Whole blood</option><option>Red blood cells</option><option>Platelets</option><option>Plasma</option></select></div><div class="field"><label for="intake-collected">Collection date</label><input id="intake-collected" name="collected" type="date" value="${today()}" required></div><div class="field"><label for="intake-expires">Expiry date</label><input id="intake-expires" name="expires" type="date" value="${shiftDate(35)}" min="${shiftDate(1)}" required></div><div class="field full"><label for="intake-source">Source</label><select id="intake-source" name="source"><option>Central Region Hub</option><option>Walk-in donation</option><option>Inter-hospital transfer</option></select></div></div><div class="form-error" id="form-error" role="alert"></div><div class="modal-actions"><button class="btn btn-secondary" type="button" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Add unit to stock</button></div></form>`;
    modal('Receive a unit','Scan the label and confirm collection details.',body);
  }
  function scanModal(prefill='') {
    const body=`<form id="scan-form" class="modal-body"><div class="scan-readout"><span class="scan-dot"></span>Barcode scanner ready · scan one unit to record a movement.</div><div class="form-grid"><div class="field full"><label for="scan-barcode">IST-128 barcode</label><input id="scan-barcode" name="barcode" placeholder="Scan or enter unit barcode" autocomplete="off" required value="${escapeHtml(prefill)}"></div><div class="field full"><label for="scan-action">Movement</label><select id="scan-action" name="action"><option value="dispense">Dispense to patient</option><option value="expire">Mark expired / discard</option></select></div><div class="field full" id="scan-detail-field"><label for="scan-detail">Patient or issue reference</label><input id="scan-detail" name="detail" placeholder="Optional reference"></div></div><div class="form-error" id="form-error" role="alert"></div><div class="modal-actions"><button class="btn btn-secondary" type="button" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Record movement</button></div></form>`;
    modal('Scan a unit','Dispensing or expiring a unit updates available stock immediately.',body);
  }
  function showError(message) { const error=document.getElementById('form-error'); if(error){error.textContent=message;error.classList.add('show');} }
  document.addEventListener('click',event=>{
    const target=event.target.closest('[data-action],[data-page]');
    if(!target)return;
    if(target.dataset.page){currentPage=target.dataset.page;render();return;}
    const action=target.dataset.action;
    if(action==='intake'){intakeModal();return;}
    if(action==='scan'){scanModal();return;}
    if(action==='close-modal'){closeModal();return;}
    if(action==='backdrop'&&event.target===target){closeModal();return;}
    if(action==='scan-unit'){scanModal(target.dataset.barcode);return;}
    if(action==='dispatch'||action==='acknowledge'){
      const request=state.requisitions.find(item=>item.id===target.dataset.id);
      if(request){request.status=action==='dispatch'?'sent':'received';save();render();showToast(action==='dispatch'?'Request marked as sent to the hub.':'Hub acknowledgement recorded.');}
    }
  });
  document.addEventListener('change',event=>{
    if(event.target.id==='inventory-filter'){inventoryFilter=event.target.value;render();}
    if(event.target.id==='scan-action'){
      const field=document.getElementById('scan-detail-field');
      if(field)field.style.display=event.target.value==='dispense'?'grid':'none';
    }
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='inventory-search'){
      const position=event.target.selectionStart;
      inventorySearch=event.target.value;
      render();
      const input=document.getElementById('inventory-search');
      input?.focus();input?.setSelectionRange(position,position);
    }
  });
  document.addEventListener('submit',event=>{
    if(event.target.id==='intake-form'){
      event.preventDefault();
      const data=new FormData(event.target), barcode=String(data.get('barcode')).trim().toUpperCase();
      if(state.units.some(unit=>unit.barcode.toUpperCase()===barcode)){showError('This barcode is already registered. Each unit must have a unique barcode.');return;}
      const collected=String(data.get('collected')), expires=String(data.get('expires'));
      if(expires<=today()||expires<=collected){showError('Expiry must be after the collection date and later than today.');return;}
      const unit={barcode,type:String(data.get('type')),component:String(data.get('component')),collected,expires,source:String(data.get('source')),status:'available'};
      state.units.unshift(unit);addMovement('Received',unit,unit.source);checkRequisitions();save();closeModal();render();showToast(`${unit.type} unit received and added to stock.`);
    }
    if(event.target.id==='scan-form'){
      event.preventDefault();
      const data=new FormData(event.target), barcode=String(data.get('barcode')).trim().toUpperCase();
      const unit=state.units.find(item=>item.barcode.toUpperCase()===barcode);
      if(!unit){showError('No unit matches this barcode. Check the label or receive the unit into stock first.');return;}
      const action=String(data.get('action')), status=unitStatus(unit);
      if(status!=='available'){showError(`This unit is already ${status}; it cannot be recorded again.`);return;}
      unit.status=action==='dispense'?'dispensed':'expired';
      const detail=action==='dispense'?String(data.get('detail')||'Patient issue'):'Discarded';
      addMovement(action==='dispense'?'Dispensed':'Expired',unit,detail);
      checkRequisitions();save();closeModal();render();showToast(`${unit.type} unit ${action==='dispense'?'dispensed':'marked expired'}. Stock updated.`);
    }
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modalRoot.innerHTML)closeModal();});
  render();
})();
</script>
</body>
</html>
