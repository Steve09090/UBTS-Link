<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" fill="none">
  <defs>
    <!-- Soft clinical gradients for illustration elements -->
    <linearGradient id="ugandaRedFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="ugandaGreenFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c3d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f4c3d" stop-opacity="0.01"/>
    </linearGradient>

    <linearGradient id="goldSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#be123c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background decorative Uganda map silhouette watermark (East Africa / Uganda border outline) -->
  <g transform="translate(680, 40) scale(0.9)" opacity="0.45">
    <!-- Simplified Uganda boundary contour -->
    <path d="M 220 80 C 260 70, 310 90, 340 130 C 370 170, 400 180, 420 220 C 440 260, 420 310, 400 350 C 380 390, 340 430, 290 460 C 240 490, 190 510, 150 490 C 110 470, 80 430, 70 380 C 60 330, 80 270, 100 230 C 120 190, 150 160, 170 120 Z" 
          fill="url(#ugandaGreenFade)" stroke="#0f4c3d" stroke-width="1.2" stroke-opacity="0.1" stroke-dasharray="6 8"/>
    
    <!-- Lake Victoria water boundary curve -->
    <path d="M 260 410 C 290 400, 330 420, 360 450 C 380 470, 400 500, 390 530 C 360 550, 310 540, 270 510 C 240 480, 240 440, 260 410 Z" 
          fill="#3b82f6" fill-opacity="0.04" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.1"/>
  </g>

  <!-- Heartbeat ECG line connecting across the banner -->
  <path d="M 20 280 L 160 280 L 180 250 L 195 320 L 215 220 L 235 340 L 250 265 L 265 295 L 280 280 L 450 280 M 750 280 L 890 280 L 910 240 L 925 330 L 945 210 L 965 350 L 980 260 L 995 295 L 1010 280 L 1180 280" 
        stroke="#be123c" stroke-width="1.2" stroke-opacity="0.12" fill="none" stroke-linecap="round"/>

  <!-- Uganda Blood Donation Scene (Right & Center Background) -->
  <g transform="translate(620, 100)" opacity="0.65">
    <!-- Medical Blood Collection Tent / Mobile Clinic Roof Canopy -->
    <path d="M 120 120 L 260 60 L 400 120 L 380 140 L 140 140 Z" fill="#0f4c3d" fill-opacity="0.05" stroke="#0f4c3d" stroke-width="1" stroke-opacity="0.12"/>
    <path d="M 260 60 L 260 140" stroke="#0f4c3d" stroke-width="0.8" stroke-opacity="0.1"/>

    <!-- UBTS Emblem / Cross on Clinic Banner -->
    <circle cx="260" cy="115" r="14" fill="#ffffff" fill-opacity="0.6" stroke="#be123c" stroke-width="1" stroke-opacity="0.2"/>
    <path d="M 260 106 L 260 124 M 251 115 L 269 115" stroke="#be123c" stroke-width="2.5" stroke-opacity="0.25" stroke-linecap="square"/>

    <!-- Donor Couch / Recliner Chair -->
    <path d="M 100 340 L 140 310 L 220 310 L 300 270 L 340 210" fill="none" stroke="#0f4c3d" stroke-width="3" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M 140 310 L 140 370 M 220 310 L 220 370 M 280 280 L 280 370" stroke="#0f4c3d" stroke-width="2" stroke-opacity="0.12"/>

    <!-- Volunteer Blood Donor Silhouette (Reclined comfortably giving blood) -->
    <!-- Head -->
    <circle cx="335" cy="175" r="18" fill="#0f4c3d" fill-opacity="0.12"/>
    <!-- Torso -->
    <path d="M 320 195 C 310 220, 270 250, 230 260 C 200 270, 170 280, 140 290" stroke="#0f4c3d" stroke-width="14" stroke-opacity="0.1" stroke-linecap="round" fill="none"/>
    <!-- Extended Donor Arm (receiving phlebotomy) -->
    <path d="M 265 240 C 240 240, 210 245, 185 248" stroke="#0f4c3d" stroke-width="7" stroke-opacity="0.14" stroke-linecap="round" fill="none"/>
    
    <!-- Phlebotomist / Nurse in Scrubs Silhouette (Attending with care) -->
    <!-- Head -->
    <circle cx="160" cy="170" r="16" fill="#0f4c3d" fill-opacity="0.14"/>
    <!-- Medical Cap -->
    <path d="M 144 165 C 145 152, 175 152, 176 165 Z" fill="#0f4c3d" fill-opacity="0.18"/>
    <!-- Torso / Lab coat -->
    <path d="M 160 188 C 150 205, 145 235, 148 275 L 175 275 C 175 235, 170 205, 160 188 Z" fill="#0f4c3d" fill-opacity="0.09" stroke="#0f4c3d" stroke-width="1" stroke-opacity="0.15"/>
    <!-- Nurse Hands guiding collection line -->
    <path d="M 152 215 C 160 230, 175 242, 185 248" stroke="#0f4c3d" stroke-width="5" stroke-opacity="0.12" stroke-linecap="round" fill="none"/>

    <!-- Blood Bag on Automated Shaker Scale -->
    <!-- Stand -->
    <path d="M 195 248 L 195 300" stroke="#be123c" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round"/>
    <!-- Clear Blood Bag Silhouette -->
    <rect x="183" y="300" width="24" height="34" rx="4" fill="#ffffff" fill-opacity="0.5" stroke="#be123c" stroke-width="1.2" stroke-opacity="0.3"/>
    <!-- Blood volume inside bag (partially filled CPDA-1) -->
    <path d="M 184 316 C 188 314, 202 314, 206 316 L 206 331 C 206 333, 204 334, 201 334 L 189 334 C 186 334, 184 333, 184 331 Z" fill="#be123c" fill-opacity="0.2"/>
    <!-- Bag label line -->
    <rect x="187" y="306" width="16" height="6" fill="#64748b" fill-opacity="0.15"/>
    <!-- Shaker scale base -->
    <rect x="175" y="335" width="40" height="7" rx="2" fill="#0f4c3d" fill-opacity="0.15"/>
    <path d="M 195 342 L 195 370" stroke="#0f4c3d" stroke-width="1.5" stroke-opacity="0.12"/>

    <!-- Life-giving Blood Droplet cluster floating from donation -->
    <g transform="translate(195, 230)">
      <path d="M 0 -24 C 0 -24 -9 -10 -9 -3 C -9 3 -4 8 0 8 C 4 8 9 3 9 -3 C 9 -10 0 -24 0 -24 Z" fill="#be123c" fill-opacity="0.16"/>
      <circle cx="0" cy="-3" r="16" fill="url(#heartGlow)"/>
    </g>

    <g transform="translate(245, 175) scale(0.65)">
      <path d="M 0 -24 C 0 -24 -9 -10 -9 -3 C -9 3 -4 8 0 8 C 4 8 9 3 9 -3 C 9 -10 0 -24 0 -24 Z" fill="#be123c" fill-opacity="0.14"/>
    </g>

    <g transform="translate(285, 210) scale(0.5)">
      <path d="M 0 -24 C 0 -24 -9 -10 -9 -3 C -9 3 -4 8 0 8 C 4 8 9 3 9 -3 C 9 -10 0 -24 0 -24 Z" fill="#be123c" fill-opacity="0.12"/>
    </g>
  </g>

  <!-- Left Side: Community Voluntary Donors Walking to UBTS Collection Center -->
  <g transform="translate(80, 140)" opacity="0.45">
    <!-- Donors standing in solidarity silhouette -->
    <!-- Person 1 -->
    <circle cx="90" cy="180" r="14" fill="#0f4c3d" fill-opacity="0.1"/>
    <path d="M 90 196 C 75 210, 70 235, 72 275 L 108 275 C 110 235, 105 210, 90 196 Z" fill="#0f4c3d" fill-opacity="0.07"/>

    <!-- Person 2 (Female Donor) -->
    <circle cx="130" cy="185" r="13" fill="#0f4c3d" fill-opacity="0.1"/>
    <path d="M 130 200 C 118 212, 114 235, 116 275 L 144 275 C 146 235, 142 212, 130 200 Z" fill="#0f4c3d" fill-opacity="0.07"/>

    <!-- Person 3 (Student Volunteer) -->
    <circle cx="170" cy="190" r="12" fill="#0f4c3d" fill-opacity="0.1"/>
    <path d="M 170 204 C 158 215, 155 235, 157 275 L 183 275 C 185 235, 182 215, 170 204 Z" fill="#0f4c3d" fill-opacity="0.07"/>

    <!-- Ground baseline -->
    <line x1="40" y1="275" x2="220" y2="275" stroke="#0f4c3d" stroke-width="1" stroke-opacity="0.1"/>
  </g>

  <!-- Watermark Motto Text (Low Opacity, Elegant) -->
  <text x="600" y="580" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#0f4c3d" fill-opacity="0.08">
    UGANDA BLOOD TRANSFUSION SERVICES · SAFE BLOOD SAVES LIVES · NAKASERO &amp; REGIONAL HUBS
  </text>
</svg>
